<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fusion Kilmacolm</title>
  <meta name="description" content="Fusion Kilmacolm — site coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a2a24;
      --mist: #e8f0eb;
      --leaf: #2f6b4f;
      --leaf-deep: #1e4a36;
      --glow-soft: rgba(255, 248, 230, 0.55);
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Source Sans 3", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 10% 0%, var(--glow-soft), transparent 55%),
        radial-gradient(90% 70% at 90% 20%, rgba(47, 107, 79, 0.18), transparent 50%),
        linear-gradient(165deg, #f4faf6 0%, #dce9e1 45%, #c5d8cc 100%);
      overflow-x: hidden;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(
          -18deg,
          transparent,
          transparent 11px,
          rgba(26, 42, 36, 0.025) 11px,
          rgba(26, 42, 36, 0.025) 12px
        );
      animation: drift 28s linear infinite;
      opacity: 0.7;
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-24px); }
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 4vw, 3rem);
    }

    .hero {
      width: min(40rem, 100%);
      text-align: center;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2.75rem, 9vw, 4.75rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--leaf-deep);
      animation: rise 0.9s ease-out both;
    }

    .brand span {
      display: block;
      font-weight: 500;
      font-size: 0.42em;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--leaf);
      margin-top: 0.65em;
    }

    .lede {
      margin-top: 1.5rem;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      line-height: 1.55;
      max-width: 28rem;
      margin-inline: auto;
      color: rgba(26, 42, 36, 0.82);
      animation: rise 0.9s ease-out 0.15s both;
    }

    .status {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--leaf-deep);
      animation: rise 0.9s ease-out 0.3s both;
    }

    .status::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--leaf);
      box-shadow: 0 0 0 0 rgba(47, 107, 79, 0.45);
      animation: pulse 2.2s ease-out infinite;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(47, 107, 79, 0.45); }
      70% { box-shadow: 0 0 0 12px rgba(47, 107, 79, 0); }
      100% { box-shadow: 0 0 0 0 rgba(47, 107, 79, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .atmosphere,
      .brand,
      .lede,
      .status,
      .status::before {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main>
    <section class="hero">
      <h1 class="brand">
        Fusion
        <span>Kilmacolm</span>
      </h1>
      <p class="lede">
        A placeholder home page while the full site is being prepared.
      </p>
      <p class="status">Coming soon</p>
    </section>
  </main>
</body>
</html>
